volumes:
  pg_data:
  static:
  media:
  frontend_build:

services:
  db:
    container_name: foodgram-db
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12
    restart: always

  backend:
    container_name: foodgram-backend
    build: ../backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/start-backend.sh"]
    healthcheck:
      start_period: 90s
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - static:/app/collected_static
      - media:/app/media
      - ../data/:/data/:ro
      - ./start-backend.sh:/start-backend.sh:ro
    restart: always

  frontend:
    container_name: foodgram-front
    build: ../frontend
    command: sh -c "cp -r /app/build/. /app/result_build/"
    volumes:
      - frontend_build:/app/result_build/

  nginx:
    container_name: foodgram-proxy
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_build:/usr/share/nginx/html/
      - ../docs/:/usr/share/nginx/html/api/docs/
      - static:/var/html/static/
      - media:/var/html/media/
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    restart: always
